<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Revision Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/design-system.css?v=4.2">

<!-- MathJax for rendering LaTeX -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)'], ['$', '$']],
      displayMath: [['\\[', '\\]'], ['$$', '$$']]
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</head>
<body style="background:#030303; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="glow-bg"></div>

    <div class="glass-modal active" style="position: relative; display: flex;">
        <div class="modal-content" style="max-width: 400px; padding: 2rem; width: 100%;">
            <div class="modal-header" style="border: none; padding-bottom: 1rem;">
                <h3 style="margin: 0; font-size: 1.5rem;">Set New Password</h3>
            </div>
            <div class="modal-body">
                <div id="resetError" style="color: #ef4444; margin-bottom: 1rem; font-size: 0.9rem; display: none;"></div>
                <div id="resetSuccess" style="color: #10b981; margin-bottom: 1rem; font-size: 0.9rem; display: none;"></div>
                
                <form id="resetForm" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label style="font-size: 0.9rem; color: #a0a0a5;">New Password</label>
                        <input type="password" id="newPassword" class="search-bar" style="width: 100%; border-radius: 8px;" required>
                    </div>
                    <button type="submit" id="resetSubmitBtn" class="btn btn-primary" style="margin-top: 0.5rem;">Update Password</button>
                </form>
                
                <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
                    <a href="index.html" style="color: var(--primary-teal); text-decoration: none;">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './shared/supabase-client.js';
        import { onAuthStateChange } from './shared/auth.js';

        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('resetSubmitBtn');
        const errorDiv = document.getElementById('resetError');
        const successDiv = document.getElementById('resetSuccess');

        // Check if we have the recovery token in URL hash
        if (!window.location.hash.includes('type=recovery')) {
            // It might have already been processed by supabase client and placed in local storage
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            const newPassword = document.getElementById('newPassword').value;

            try {
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });
                
                if (error) throw error;
                
                successDiv.textContent = "Password updated successfully! Redirecting...";
                successDiv.style.display = 'block';
                form.style.display = 'none';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } catch (err) {
                errorDiv.textContent = err.message || "An error occurred.";
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        };
    </script>
</body>
</html>
